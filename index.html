<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #10151b;
            --text-color: #e6d8c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }

        /* Navbar */
        nav {
            width: fit-content;
            max-width: 720px;
            margin: 28px auto 48px;
            padding: 12px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: #161c24;
            border: 1px solid #1f262f;
            outline: 1px solid #26303a;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        nav a:hover {
            background-color: rgba(230, 216, 192, 0.12);
            transform: translateY(-1px);
        }

        nav svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Main content */
        main {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 24px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .social-links {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .social-links a {
            color: var(--text-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            background: #161c24;
            border: 1px solid #1f262f;
            outline: 1px solid #26303a;
            transition: background-color 0.2s ease, transform 0.2s ease, outline-color 0.2s ease;
        }

        .social-links a:hover {
            background-color: rgba(230, 216, 192, 0.12);
            outline-color: rgba(230, 216, 192, 0.5);
            transform: translateY(-1px);
        }

        .social-links svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        p {
            font-size: 1.1rem;
            max-width: 700px;
        }

        .about {
            text-align: left;
            margin: 0;
            max-width: 520px;
        }

        /* Image section */
        .image-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: nowrap;
            margin: 0 auto 28px;
        }

        .image-grid img {
            width: min(320px, 60vw);
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }

        @media (max-width: 720px) {
            .image-grid {
                flex-wrap: wrap;
            }

            .about {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 10.75 12 4l8 6.75"/>
                <path d="M5.5 11.75V20h4.5v-4.75h4V20h4.5v-8.25"/>
            </svg>
            <span>Home</span>
        </a>
        <a href="labs.html">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4.5 6.5h5l1.5 2H19a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-14a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/>
            </svg>
            <span>Labs</span>
        </a>
    </nav>

    <main>
        <section class="hero">
            <h1>Gerardo Montemayor</h1>
            <div class="social-links">
                <a href="https://gerry-montemayor.github.io/portfolio/" aria-label="Personal site">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M12 12c2.8 0 5-2.2 5-5s-2.2-5-5-5-5 2.2-5 5 2.2 5 5 5Z"/>
                        <path d="M4 21c0-3.3 3.6-6 8-6s8 2.7 8 6"/>
                    </svg>
                </a>
                <a href="https://www.linkedin.com/in/gerry-montemayor/" aria-label="LinkedIn">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M5.5 9.5h3v10h-3z"/>
                        <circle cx="7" cy="6.5" r="1.5"/>
                        <path d="M11 19.5v-7.8h2.9l.1 1.3a3.3 3.3 0 0 1 2.8-1.5c2 0 3.2 1.3 3.2 3.6v4.4h-3v-4c0-1-.4-1.7-1.4-1.7-1 0-1.6.8-1.6 1.9v3.8z"/>
                    </svg>
                </a>
                <a href="https://github.com/gerry-montemayor" aria-label="GitHub">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M12 2.5c-5.2 0-9.5 4.3-9.5 9.5 0 4.2 2.7 7.7 6.4 9 .5.1.6-.2.6-.4v-1.8c-2.6.6-3.1-1.2-3.1-1.2-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1 3 .8.1-.6.4-1 .7-1.3-2.1-.2-4.4-1-4.4-4.8 0-1.1.4-2 1-2.7-.1-.2-.4-1.2.1-2.5 0 0 .8-.3 2.8 1 .8-.2 1.7-.3 2.6-.3.9 0 1.8.1 2.6.3 2-1.3 2.8-1 2.8-1 .5 1.3.3 2.3.1 2.5.6.7 1 1.6 1 2.7 0 3.8-2.4 4.6-4.5 4.8.4.3.7.9.7 1.8v2.6c0 .2.1.5.6.4 3.7-1.3 6.4-4.8 6.4-9 0-5.2-4.3-9.5-9.5-9.5Z"/>
                    </svg>
                </a>
            </div>
        </section>

        <section class="image-grid">
            <img src="picture.jpg" alt="Profile picture">
            <p class="about">
                I'm a Senior at Cornell University majoring in Computer Science with a minor in ECE.
                In my free time, I enjoy playing soccer, learning guitar, and cooking. This page will be where
                I document my progress through the labs for ECE 4160: Fast Robots.
            </p>
        </section>
    </main>

</body>
</html>
